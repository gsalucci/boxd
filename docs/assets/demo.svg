.o12{animation:o12 27s infinite}@keyframes o12{0%,48.85%{opacity:0}48.89%,100%{opacity:1}}
.w13{animation:w13 27s infinite}@keyframes w13{0%,68.15%{width:0;animation-timing-function:steps(28,end)}71.85%,100%{width:820px}}
.o14{animation:o14 27s infinite}@keyframes o14{0%,72.55%{opacity:0}72.59%,100%{opacity:1}}
