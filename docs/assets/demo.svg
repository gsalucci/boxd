<path d="M10 22a12 12 0 0 1 12-12h816a12 12 0 0 1 12 12v22H10z" fill="#171d22"/>
<circle cx="34" cy="27" r="6" fill="#ff5f56"/><circle cx="56" cy="27" r="6" fill="#ffbd2e"/><circle cx="78" cy="27" r="6" fill="#27c93f"/>
<text x="430" y="32" fill="#8b949e" text-anchor="middle" style="font-size:13px">box: build server for coding agents</text>
<g class="sa" opacity="0">
<g><g clip-path="url(#k0)"><text x="40" y="100" xml:space="preserve"><tspan fill="#8b949e">~/src/myapp $ </tspan><tspan fill="#6db3e0">box hosts</tspan></text></g></g>
<g class="o1"><text x="40" y="132" xml:space="preserve"><tspan fill="#d7dce0">tower   sleeps     awake  cpus=16  boxes=4  box_room=</tspan><tspan fill="#7fc98f">yes</tspan></text></g>
<g class="o2"><text x="40" y="164" xml:space="preserve"><tspan fill="#d7dce0">laptop  always on  awake  cpus=12  boxes=1  box_room=</tspan><tspan fill="#8b949e">no</tspan></text></g>
<g class="o3"><text x="40" y="228" xml:space="preserve"><tspan fill="#8b949e"># two build servers: tower has room, laptop is full right now</tspan></text></g>
</g>
<g class="sb" opacity="0">
<g><g clip-path="url(#k4)"><text x="40" y="100" xml:space="preserve"><tspan fill="#8b949e">~/src/myapp $ </tspan><tspan fill="#6db3e0">box sh test.sh</tspan></text></g></g>
<g class="o5"><text x="40" y="132" xml:space="preserve"><tspan fill="#8b949e">boxd-pod: new container box myapp-3f9a21c7: commands run as root</tspan></text></g>
<g class="o6"><text x="40" y="164" xml:space="preserve"><tspan fill="#d7dce0">running 3 checks</tspan></text></g>
<g class="o7"><text x="40" y="196" xml:space="preserve"><tspan fill="#d7dce0">check parse_config ... </tspan><tspan fill="#7fc98f">ok</tspan></text></g>
<g class="o8"><text x="40" y="228" xml:space="preserve"><tspan fill="#d7dce0">check roundtrip ... </tspan><tspan fill="#7fc98f">ok</tspan></text></g>
<g class="o9"><text x="40" y="260" xml:space="preserve"><tspan fill="#d7dce0">check cli_flags ... </tspan><tspan fill="#7fc98f">ok</tspan></text></g>
<g class="o10"><text x="40" y="292" xml:space="preserve"><tspan fill="#7fc98f">3 passed, 0 failed</tspan></text></g>
<g class="o11"><text x="40" y="324" xml:space="preserve"><tspan fill="#7fc98f">box: exit 0 on tower</tspan></text></g>
<g class="o12"><text x="40" y="388" xml:space="preserve"><tspan fill="#8b949e"># first call: box made, files synced, 7.4 s</tspan></text></g>
</g>
<g class="sc">
<g><g clip-path="url(#k13)"><text x="40" y="100" xml:space="preserve"><tspan fill="#8b949e">~/src/myapp $ </tspan><tspan fill="#6db3e0">box sh test.sh</tspan></text></g></g>
<g class="o14"><text x="40" y="132" xml:space="preserve"><tspan fill="#d7dce0">running 3 checks</tspan></text></g>
<g class="o15"><text x="40" y="164" xml:space="preserve"><tspan fill="#d7dce0">check parse_config ... </tspan><tspan fill="#7fc98f">ok</tspan></text></g>
<g class="o16"><text x="40" y="196" xml:space="preserve"><tspan fill="#d7dce0">check roundtrip ... </tspan><tspan fill="#7fc98f">ok</tspan></text></g>
<g class="o17"><text x="40" y="228" xml:space="preserve"><tspan fill="#d7dce0">check cli_flags ... </tspan><tspan fill="#7fc98f">ok</tspan></text></g>
<g class="o18"><text x="40" y="260" xml:space="preserve"><tspan fill="#7fc98f">3 passed, 0 failed</tspan></text></g>
<g class="o19"><text x="40" y="292" xml:space="preserve"><tspan fill="#7fc98f">box: exit 0 on tower</tspan></text></g>
<g class="o20"><text x="40" y="356" xml:space="preserve"><tspan fill="#8b949e"># same box, caches kept: 5.8 s (3 s of it is the checks)</tspan></text></g>
</g>
