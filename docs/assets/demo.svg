<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" role="img" aria-labelledby="t d">
<title id="t">boxd in a terminal: box runs a command on a build server</title>
<desc id="d">A recording of three commands. First, box hosts lists two build servers, tower and laptop, and tower has room. Then box sh test.sh makes a box for the worktree on tower, syncs the files and runs three checks, which pass in 7.4 seconds. The same command again reuses the box and finishes in 5.8 seconds, three of them the checks themselves.</desc>
