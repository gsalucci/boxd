# Podman storage for the build account: the kernel's own overlay (unprivileged overlay works since Linux 5.13),
# never fuse-overlayfs, which runs every box's file system through a user-space process and is slower.
# No mount_program on purpose. Images stay under the account's own cache folder in the work area (XDG_DATA_HOME).
[storage]
driver = "overlay"

[storage.options.overlay]
