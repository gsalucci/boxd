# boxd settings (sh syntax), read by every boxd program. The package keeps your edits on upgrade.
# Every line shows the default the code uses when the line is missing; remove the leading # to change one.
# After a change: `boxctl reload` (restarts only the build sshd and, with the power module on, boxd-idle; boxes are
# not touched). Boxes pick up BOXD_LIMITS, BOXD_VM_LIMITS and BOXD_IMAGE when they are created.

# The build account and its work area (a btrfs subvolume mounted there by boxd-setup).
#BOXD_USER=boxd
#BOXD_WORK=/var/lib/boxd/work
# How the work area is kept clean (boxd-setup reads it): auto uses btrfs subvolumes when the file system under the work
# area is btrfs, else a plain folder that boxd-reset refreshes with rsync (seconds to minutes instead of milliseconds).
# btrfs or dir forces one. Only the first boxd-setup decides: the choice is then recorded by the work area itself.
#BOXD_WORK_FS=auto
# Port of the build sshd, and an address range the sshd never penalizes for connections that do not log in
# (clients probe the port before every ssh). Empty means no exemption; give an address range as network/length
#BOXD_PORT=2222
#BOXD_TRUSTED_NET=

# Limits of every new box, as podman run options: 12 GB of memory and 4 GB of swap, equal processor weight.
#BOXD_LIMITS="--memory 12g --memory-swap 16g --pids-limit 4096 --cpu-shares 1024"
# Seconds a box may stay unused before the boxd service removes its container (files stay).
#BOXD_TTL=1800
# Registries a box image may come from (space separated). Short names like rust:1.83 mean docker.io.
#BOXD_REGISTRIES="docker.io ghcr.io"
# Image of a box when the client names none.
#BOXD_IMAGE=docker.io/library/debian:stable-slim
# Virtual machine boxes (--vm): options of msb create for the "large" size (box --size: small is -c 2 -m 2G, medium
# -c 4 -m 4G), size of each owned docker and podman disk. A new machine is admitted when the memory the build cgroup
# really uses plus the machine's size fits its memory.max. Each other running machine adds 64 MB to that memory.max, for the engine's own memory. BOXD_VM_MAX is an optional hard ceiling on running machines
# on top of that (unset: no count limit; when the cgroup cannot be read, 3 is used). A young machine has not claimed its
# memory yet, so the sizes of the running machines plus the new one must also fit BOXD_VM_COMMIT percent of memory.max
# (100: the sizes never exceed the cap; higher: more machines, on the bet that they do not all fill up at once).
#BOXD_VM_LIMITS="-c 4 -m 8G"
#BOXD_VM_MAX=
#BOXD_VM_COMMIT=100
# Container boxes (the default kind) are admitted the same way, with one number: a call that starts work in a container box that is not busy
# is refused (exit 75, "no room for another busy box"; --wait waits) unless this many megabytes are still free within BOXD_VM_COMMIT percent of
# memory.max, after the sizes of the running machines and the memory the other container boxes use. A box with a call or run that began
# no more than BOXD_VM_IDLE_MIN seconds ago (default 300) counts at least this much, as a young machine counts its size. 0: no such rule, only the cap.
#BOXD_BOX_RESERVE=4096
# Seconds after which a waiting call (box --wait) that has not asked again loses its place in line (the client asks every 30 seconds).
#BOXD_QUEUE_LIVE=120
#BOXD_VM_ENGINE_DISK=32G
#BOXD_VM_TMP_DISK=64G
# Size limit of /job and of /cache in a machine box (the engine limits a mounted folder to 4G unless told). A machine made earlier needs --recreate.
#BOXD_VM_JOB_DISK=64G
#BOXD_VM_CACHE_DISK=64G
# Home-network services virtual machine boxes may reach (they reach only the public internet otherwise), e.g. model
# servers: words <address[/bits]>:<tcp|udp>:<port[-port]>. Applies to vm boxes created after the change.
#BOXD_VM_NET_ALLOW="192.0.2.10:tcp:48080 192.0.2.50:tcp:8080"

# Caps of the whole build cgroup (every session and box): memory.max and memory.swap.max.
# Defaults are computed when the build sshd starts: 85 % and 25 % of the memory of the host. Swap on zram is kept in RAM, so
# the swap the group may put there, counted in full, is taken off the memory cap; a set BOXD_MEM_MAX that leaves the host short logs a
# warning. Under runit, boxd-sshd waits up to 30 seconds for the zram swap to be on before it computes them. A change takes effect when boxd-sshd restarts: lowering the cap under what the boxes use makes the kernel kill one.
#BOXD_MEM_MAX=
#BOXD_SWAP_MAX=
# The folder of the build cgroup that boxd-pod measures for virtual machine admission (and that holds the caps above).
# Default /sys/fs/cgroup/boxd, made by the runit service. The Debian package sets it to the cgroup systemd makes for
# boxd-sshd.service: /sys/fs/cgroup/boxd.slice/boxd-sshd.service. Change it only together with the service.
#BOXD_CGROUP=/sys/fs/cgroup/boxd

# A caching repository for Java packages on the home network (a repository manager): every box's Maven then uses it in place of the
# public central source. A machine box reaches it only when its address and port are also in BOXD_VM_NET_ALLOW.
#BOXD_MAVEN_MIRROR=http://192.0.2.50:18081/maven/

# Retention: boxd removes whole box folders (jobs/<box>) by itself. Days without any call after which a folder goes (the same
# number is the age after which the image archives of removed boxes and unused images go, once a day, and, under disk pressure only,
# after which a shared package cache file goes, judged by the time it was written on the host); fill level of the
# file system the work area is on (percent of the whole disk) from which the least recently used folder goes, one per minute, and
# the level under which that stops. On a disk the system shares, boxd-setup writes lower values here once (a disk fill plus 20 points,
# at most 70; ten less; 3 days); the defaults below suit a disk that is boxd's own.
# While a build is live the shared package caches are kept, until the fill level is halfway between the first level and 100 percent.
#BOXD_KEEP_DAYS=14
#BOXD_EVICT_AT=70
#BOXD_EVICT_TO=60

# Power module (boxd-power): off or on. Core boxd never touches sleep or wake settings.
#BOXD_POWER=off
# Power module only: quiet minutes before sleep, load below which the host counts as quiet, disk percent that
# resets the build area before a sleep, and the network cards wake-on-network is armed on (at least one is needed).
#BOXD_IDLE_CHECKS=20
#BOXD_IDLE_LOAD_MAX=0.5
#BOXD_RESET_AT=85
#BOXD_WIRED=
#BOXD_WIFI=
# Addresses (words) whose connections on the build port BOXD_PORT are not work for the power module, so that the dashboard's polls
# never keep the host awake (a build started from one of them is then kept awake by its load, not by its connection). Port 22 always
# counts. Empty: every connection counts.
#BOXD_IDLE_IGNORE=
# Keys that may only read (the dashboard's) are not a setting: they are listed one per line in /etc/boxd/view_keys, and the build
# sshd's settings (/etc/boxd/sshd_config) need "ExposeAuthInfo yes" for boxd-pod to tell which key logged in. Add one with
# `boxd-setup --view-key <public key file>`, then `boxctl reload`. Listed keys can run pod status, list, ps, report, calls and log.
