# The tests that need no real host and no sudo: on every push to a branch and on every pull request, and as a part of the
# release workflow. By hand: node --test tests/*.test.mts, then tools/test-shell.
name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # jq, git and rsync are what the tests call and a runner may lack (read from the tests, then proven in a bare Ubuntu);
      # one contract test case wants a locale with a comma decimal separator, so Italian is generated.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq git rsync locales && sudo locale-gen it_IT.UTF-8
      - run: node --test tests/*.test.mts
      - run: sh tools/test-shell
